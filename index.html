<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AuriaOS</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<!-- The desktop area where windows live -->
	<div id="desktop">

		<!-- Desktop icons -->
		<div class="desktop-icons">
			<div class="icon" data-app="browser">
				<div class="icon-image">🌐</div>
				<span class="icon-label">Browser</span>
			</div>
			<div class="icon" data-app="terminal">
				<div class="icon-image">💻</div>
				<span class="icon-label">Terminal</span>
			</div>
			<div class="icon" data-app="notepad">
				<div class="icon-image">📝</div>
				<span class="icon-label">Notes</span>
			</div>
			<div class="icon" data-app="apps">
				<div class="icon-image">🗂️</div>
				<span class="icon-label">Apps</span>
			</div>
			<div class="icon" data-app="settings">
				<div class="icon-image">⚙️</div>
				<span class="icon-label">Settings</span>
			</div>
		</div>

		<!-- Windows container (initially empty) -->
		<div id="window-layer"></div>

		<!-- Ghost preview shown while dragging a window to a screen edge -->
		<div id="snap-preview"></div>

		<!-- Ambient color wash controlled by the Mood Lamp app-->
		<div id="mood-overlay"></div>

	</div>

	<!-- Taskbar at the bottom -->
	<div id="taskbar">
		<button id="start-btn">☰ Start</button>
		<div id="taskbar-apps"></div>
		<div id="system-tray">
			<span id="clock">12:00 PM</span>
		</div>
	</div>

	<!-- Start Menu (hidden by default) -->
	<div id="start-menu" class="hidden">
		<div class="start-greeting">
			<div class="start-greeting-icon-badge">🌙</div>
			<div class="start-greeting-text">
				<div class="start-greeting-title">AuriaOS</div>
				<div class="start-greeting-sub" id="start-greeting-sub">Good evening.</div>
			</div>
			<div class="start-greeting-date" id="start-greeting-date"></div>
		</div>
		<div class="start-search">
			<span class="start-search-icon">🔍</span>
			<input type="text" id="start-search-input" placeholder="Search apps and settings..." autocomplete="off">
			<span class="start-search-kbd">/</span>
		</div>
		<div class="start-section-header">
			<span class="start-section-label">Pinned</span>
			<span class="start-section-link" id="start-show-all" tabindex="0" role="button">Show all ›</span>
		</div>
		<div class="start-grid"></div>
		<div class="start-section-label">Recent</div>
		<div class="start-recent-list"></div>
		<div class="start-toggles"></div>
		<div class="start-profile">
			<div class="start-profile-avatar">🙂</div>
			<div class="start-profile-text">
				<div class="start-profile-name" id="start-profile-name">Aiden</div>
				<div class="start-profile-status"><span class="status dot"></span>Online</div>
			</div>
		</div>
		<div class="start-footer">
			<div class="start-app-row" data-action="shutdown" tabindex="0" role="button">
				<span class="start-list-icon">⏻</span>
				<span class="start-list-label">Shut Down</span>
			</div>
		</div>
	</div>

	<!--Calendar popover (taskbar clock)-->
	<div id="clock-popover" class="hidden">
		<div class="clock-popover-page">
			<div class="clock-popover-weekday" id="clock-popover-weekday"></div>
			<div class="clock-popover-daynum" id="clock-popover-daynum"></div>
			<div class="clock-popover-month" id="clock-popover-month"></div>
		</div>
		<div class="clock-popover-calendar" id="clock-popover-calendar"></div>
	</div>

	<!-- Templates for windows -->
	<template id="window-template">
		<div class="window">
			<div class="window-titlebar">
				<span class="window-title">App Name</span>
				<div class="window-controls">
					<button class="minimize">−</button>
					<button class="maximize">□</button>
					<button class="close">×</button>
				</div>
			</div>
			<div class="window-content"></div>

			<!-- Resize handles: 4 edges + 4 corner -->
			<div class="resize-handle resize-n" data-dir="n"></div>
			<div class="resize-handle resize-s" data-dir="s"></div>
			<div class="resize-handle resize-e" data-dir="e"></div>
			<div class="resize-handle resize-w" data-dir="w"></div>
			<div class="resize-handle resize-ne" data-dir="ne"></div>
			<div class="resize-handle resize-nw" data-dir="nw"></div>
			<div class="resize-handle resize-se" data-dir="se"></div>
			<div class="resize-handle resize-sw" data-dir="sw"></div>
		</div>
	</template>

	<!-- App Content Templates -->

	<!-- Browser -->
	<template id="content-browser">
		<div class="browser-app">
			<div style="padding: 40px; text-align: center; color: var(--text-dim)">
				🌐 Browser will go here <br>
				<input type="text" placeholder="https://..." style="margin-top: 20px; padding: 8px 16px; width: 300px;
				border-radius: 3px; border: 1px solid var(--border); background: var(--bg-light); color: var(--text)">
			</div>
		</div>
	</template>

	<!-- Terminal -->
	<template id="content-terminal">
		<div class="terminal-app">
			<div class="terminal-output"></div>
			<div class="terminal-input-row">
				<span class="terminal-prompt-inline">user@auriaos:~$</span>
				<input type="text" class="terminal-input" autocomplete="off" spellcheck="false">
			</div>
		</div>
	</template>

	<!-- Notepad -->
	<template id="content-notepad">
		<div class="notepad-app">
			<textarea style="width: 100%; height: 100%; background: transparent; border: none; color: var(--text); font-size: 14px;
			resize: none; outline: none; padding: 4px" placeholder="Start typing..."></textarea>
		</div>
	</template>

	<!-- Calculator -->
	<template id="content-calculator">
		<div class="calculator-app">
			<div class="calc-display">
				<div class="calc-sub" id="calc-sub"></div>
				<div class="calc-value" id="calc-value">0</div>
			</div>
			<div class="calc-grid">
				<button class="calc-btn calc-danger" data-action="clear">AC</button>
				<button class="calc-btn calc-danger" data-action="backspace">⌫</button>
				<button class="calc-btn calc-op" data-action="percent">%</button>
				<button class="calc-btn calc-op" data-op="÷">÷</button>
	
				<button class="calc-btn" data-digit="7">7</button>
				<button class="calc-btn" data-digit="8">8</button>
				<button class="calc-btn" data-digit="9">9</button>
				<button class="calc-btn calc-op" data-op="×">×</button>
	
				<button class="calc-btn" data-digit="4">4</button>
				<button class="calc-btn" data-digit="5">5</button>
				<button class="calc-btn" data-digit="6">6</button>
				<button class="calc-btn calc-op" data-op="−">−</button>
	
				<button class="calc-btn" data-digit="1">1</button>
				<button class="calc-btn" data-digit="2">2</button>
				<button class="calc-btn" data-digit="3">3</button>
				<button class="calc-btn calc-op" data-op="+">+</button>
	
				<button class="calc-btn calc-wide" data-digit="0">0</button>
				<button class="calc-btn" data-action="decimal">.</button>
				<button class="calc-btn calc-equals" data-action="equals">=</button>
			</div>
		</div>
	</template>

	<!-- Mood Lamp -->
	<template id="content-moodlamp">
		<div class="moodlamp-app">
			<div class="setting-row">
				<label>Ambient Light</label>
				<button class="toggle" id="mood-toggle">OFF</button>
			</div>
			<div class="moodlamp-presets">
				<button class="mood-preset" style="background: #d1893f" data-color="#d1893f" title="Ember"></button>
				<button class="mood-preset" style="background: #7a9b5c" data-color="#7a9b5c" title="Moss"></button>
				<button class="mood-preset" style="background: #b8503f" data-color="#b8503f" title="Rust"></button>
				<button class="mood-preset" style="background: #6a8caf" data-color="#6a8caf" title="Slate"></button>
			</div>
			<div class="setting-row">
				<label>Custom color</label>
				<input type="color" id="mood-color-input" value="#d1893f">
			</div>
			<div class="setting-row">
				<label>Intensity</label>
				<input type="range" id="mood-intensity-input" min="5" max="60" value="30">
			</div>
		</div>
	</template>

	<!-- Fortune -->
	<template id="content-fortune">
		<div class="fortune-app">
			<div class="fortune-cookie" id="fortune-cookie" role="button" tabindex="0">🥠</div>
			<div class="fortune-hint" id="fortune-hint">Click the cookie to crack it open</div>
			<div class="fortune-slip hidden" id="fortune-slip">
				<div class="fortune-slip-text" id="fortune-text"></div>
				<div class="fortune-slip-divider"></div>
				<div class="fortune-slip-numbers-label">Lucky Numbers</div>
				<div class="fortune-slip-numbers" id="fortune-numbers"></div>
			</div>
			<button class="fortune-again hidden" id="fortune-again">Crack Another</button>
		</div>
	</template>

	<!-- Apps folder: grid of installed apps -->
	<template id="app-apps">
		<div class="apps-folder">
			<div class="folder-item" data-app="browser">
				<span class="folder-icon">🌐</span>
				<span class="folder-label">Browser</span>
			</div>
			<div class="folder-item" data-app="terminal">
				<span class="folder-icon">💻</span>
				<span class="folder-label">Terminal</span>
			</div>
			<div class="folder-item" data-app="notepad">
				<span class="folder-icon">📝</span>
				<span class="folder-label">Notepad</span>
			</div>
			<div class="folder-item" data-app="calculator">
				<span class="folder-icon">🧮</span>
				<span class="folder-label">Calculator</span>
			</div>
			<div class="folder-item" data-app="moodlamp">
				<span class="folder-icon">🔮</span>
				<span class="folder-label">Mood Lamp</span>
			</div>
			<div class="folder-item" data-app="fortune">
				<span class="folder-icon">🥠</span>
				<span class="folder-label">Fortune</span>
			</div>
		</div>
	</template>

	<!-- Settings: simple toggles and options -->
	<template id="app-settings">
		<div class="settings-app">
			<div class="settings-section">
				<h3>Appearance</h3>
				<div class="setting-row">
					<label>Light Mode</label>
					<button class="toggle" data-setting="darkmode">OFF</button>
				</div>
				<div class="setting-row">
					<label>Accent Color</label>
					<div class="accent-colors">
						<button class="accent-btn active" style="background: #d1893f" data-accent="#d1893f"></button>
						<button class="accent-btn" style="background: #7a9b5c" data-accent="#7a9b5c"></button>
						<button class="accent-btn" style="background: #b8503f" data-accent="#b8503f"></button>
						<button class="accent-btn" style="background: #6a8caf" data-accent="#6a8caf"></button>
					</div>
				</div>
			</div>
			<div class="settings-section">
				<h3>System</h3>
				<div class="setting-row">
					<label>Animations</label>
					<button class="toggle active" data-setting="animations">ON</button>
				</div>
				<div class="setting-row">
					<label>Sounds</label>
					<button class="toggle" data-setting="sounds">OFF</button>
				</div>
			</div>
			<div class="settings-section">
				<h3>About</h3>
				<p>AuriaOS - Made with love</p>
				<p>Built with HTML, CSS and JS</p>
			</div>
		</div>
	</template>
	<script src="script.js"></script>
</body>
</html>
